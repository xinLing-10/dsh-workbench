<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">项目管家使用路线</title><desc id="desc">说想法、回答问题、同意开始、看成果、修改或确认、下载。有问题随时回到对话。</desc><rect width="1200" height="320" rx="20" fill="#f2f6fc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="35" y="42" font-size="23" fill="#173858" font-weight="bold">你负责想法与决定，管家协助准备成果</text><rect x="30" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="58" cy="105" r="16" fill="#3e6fca"/><text x="58" y="111" text-anchor="middle" font-size="18" fill="white">1</text><text x="46" y="151" font-size="23" font-weight="bold" fill="#173858">说想法</text><text x="46" y="184" font-size="13" fill="#596d85">告诉管家你想做什么</text><path d="M206 150h12m-5-5 5 5-5 5" fill="none" stroke="#6386b5" stroke-width="2"/><rect x="225" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="253" cy="105" r="16" fill="#3e6fca"/><text x="253" y="111" text-anchor="middle" font-size="18" fill="white">2</text><text x="241" y="151" font-size="23" font-weight="bold" fill="#173858">回答问题</text><text x="241" y="184" font-size="13" fill="#596d85">选选项或写自己的答案</text><path d="M401 150h12m-5-5 5 5-5 5" fill="none" stroke="#6386b5" stroke-width="2"/><rect x="420" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="448" cy="105" r="16" fill="#3e6fca"/><text x="448" y="111" text-anchor="middle" font-size="18" fill="white">3</text><text x="436" y="151" font-size="23" font-weight="bold" fill="#173858">同意开始</text><text x="436" y="184" font-size="13" fill="#596d85">先看懂具体安排</text><path d="M596 150h12m-5-5 5 5-5 5" fill="none" stroke="#6386b5" stroke-width="2"/><rect x="615" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="643" cy="105" r="16" fill="#3e6fca"/><text x="643" y="111" text-anchor="middle" font-size="18" fill="white">4</text><text x="631" y="151" font-size="23" font-weight="bold" fill="#173858">看成果</text><text x="631" y="184" font-size="13" fill="#596d85">核对目标和范围</text><path d="M791 150h12m-5-5 5 5-5 5" fill="none" stroke="#6386b5" stroke-width="2"/><rect x="810" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="838" cy="105" r="16" fill="#3e6fca"/><text x="838" y="111" text-anchor="middle" font-size="18" fill="white">5</text><text x="826" y="151" font-size="23" font-weight="bold" fill="#173858">修改或确认</text><text x="826" y="184" font-size="13" fill="#596d85">不满意就说明哪里要改</text><path d="M986 150h12m-5-5 5 5-5 5" fill="none" stroke="#6386b5" stroke-width="2"/><rect x="1005" y="76" width="170" height="151" rx="14" fill="white" stroke="#d4dfef"/><circle cx="1033" cy="105" r="16" fill="#3e6fca"/><text x="1033" y="111" text-anchor="middle" font-size="18" fill="white">6</text><text x="1021" y="151" font-size="23" font-weight="bold" fill="#173858">下载</text><text x="1021" y="184" font-size="13" fill="#596d85">拿走文档或文档包</text><text x="35" y="275" font-size="19" fill="#355c85">看不懂或不满意：随时回到对话，说“请解释一下”或“这里需要修改”。</text></g></svg>