# Independent invited-trial HTTPS site; no change to other sites or private acceptance.
map $cookie_manager_next $manager_trial_ui {
    default 127.0.0.1:8110; # initially legacy; after canary verification: 8120
    1 127.0.0.1:8120;
    0 127.0.0.1:8110;
}
server {
    listen 443 ssl http2;
    server_name 8.153.164.227;
    ssl_certificate /srv/manager-trial/tls/live/8.153.164.227/fullchain.pem;
    ssl_certificate_key /srv/manager-trial/tls/live/8.153.164.227/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
    location = /_manager/next {
        add_header Set-Cookie "manager_next=1; Path=/; Secure; HttpOnly; SameSite=Lax";
        return 302 /login;
    }
    location = /_manager/legacy {
        add_header Set-Cookie "manager_next=0; Path=/; Secure; HttpOnly; SameSite=Lax";
        return 302 /;
    }
    location ^~ /internal/ { return 404; }
    location ^~ /api/v1/ { proxy_pass http://127.0.0.1:8110; proxy_cache off; gzip off; }
    location = /healthz { proxy_pass http://127.0.0.1:8110; }
    location = /help { proxy_pass http://127.0.0.1:8110; }
    location = /app.js { proxy_pass http://127.0.0.1:8110; }
    location = /styles.css { proxy_pass http://127.0.0.1:8110; }
    location / { proxy_pass http://$manager_trial_ui; }
}
